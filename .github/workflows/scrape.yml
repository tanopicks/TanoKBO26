name: KBO Stats Scraper

on:
  schedule:
    # Se ejecuta cada 5 minutos
    - cron: '*/5 * * * *'
  workflow_dispatch: # Permite ejecutarlo manualmente desde el panel de GitHub

permissions:
  contents: write # Permite al script guardar los datos de vuelta en el repositorio

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Run KBO Scraper once
        run: node scraper.js --once

      - name: Commit and push changes
        run: |
          git config --global user.name "GitHub Action Scraper"
          git config --global user.email "actions@github.com"
          git add data.json data.js
          git commit -m "Auto-update KBO Stats data [skip ci]" || exit 0
          git push
